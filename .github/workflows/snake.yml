name: generate snake animation

on:
  schedule:
    - cron: "0 */24 * * *"   # runs once a day
  workflow_dispatch: {}       # lets you trigger it manually from the Actions tab
  push:
    branches:
      - main                  # regenerates whenever you push to main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: generate snake svg + gif
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark
            dist/github-snake.gif?palette=github-dark&color_background=%230d1117

      - name: push snake files to the output branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
